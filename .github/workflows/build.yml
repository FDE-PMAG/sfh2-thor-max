name: Build SFH2 Thor Max APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository with Full Git History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 3. Accept Pre-Installed Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: 4. Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 5. Auto-Recover Valid SWF from Git History, Decompile & Patch AS3
        run: |
          cat << 'EOF' > recover_swf.py
          import os, glob, struct, subprocess, zlib

          def check_swf_bytes(data, label=""):
              if len(data) < 5000000:
                  return False, f"{label}: Too small ({len(data)} bytes)"
              sig = data[:3]
              if sig not in (b"FWS", b"CWS", b"ZWS"):
                  return False, f"{label}: Invalid signature ({sig!r})"
              ver = data[3]
              declared_len = struct.unpack("<I", data[4:8])[0]
              if sig == b"FWS":
                  # Uncompressed FWS must match declared header length ( prevents UTF-8 corruption )
                  if abs(len(data) - declared_len) > 128:
                      return False, f"{label}: UTF-8 corrupted! Actual={len(data)} vs Header={declared_len}"
              elif sig == b"CWS":
                  try:
                      decomp = zlib.decompress(data[8:])
                      if abs(len(decomp) + 8 - declared_len) > 128:
                          return False, f"{label}: CWS length mismatch"
                  except Exception as e:
                      return False, f"{label}: CWS zlib error {e}"
              return True, f"{label}: VALID {sig.decode()} v{ver} ({len(data)} bytes, header={declared_len})"

          log_lines = []
          valid_swf_data = None

          # 1. Check current working tree .swf files first
          for f in sorted(glob.glob("**/*.swf", recursive=True)):
              with open(f, "rb") as fp:
                  d = fp.read()
              ok, msg = check_swf_bytes(d, f"WorkingTree({f})")
              log_lines.append(msg)
              if ok and valid_swf_data is None:
                  valid_swf_data = d

          # 2. If working tree SWF was corrupted by rename, scan all Git history commits!
          if valid_swf_data is None:
              log_lines.append("Working tree SWF is invalid/corrupted. Scanning Git commit history...")
              commits = subprocess.check_output(["git", "rev-list", "--all"]).decode().splitlines()
              for c in commits:
                  tree = subprocess.check_output(["git", "ls-tree", "-r", c]).decode().splitlines()
                  for line in tree:
                      if line.lower().endswith(".swf"):
                          parts = line.split()
                          blob_hash = parts[2]
                          fname = parts[-1]
                          d = subprocess.check_output(["git", "cat-file", "blob", blob_hash])
                          ok, msg = check_swf_bytes(d, f"GitCommit({c[:7]}:{fname})")
                          log_lines.append(msg)
                          if ok:
                              valid_swf_data = d
                              break
                  if valid_swf_data is not None:
                      break

          with open("swf_recovery.log", "w", encoding="utf-8") as lf:
              lf.write("\n".join(log_lines) + "\n")
          print("\n".join(log_lines))

          if valid_swf_data is None:
              raise SystemExit("FATAL: Could not find a valid uncorrupted .swf in working tree or Git history!")

          with open("working_sfh2.swf", "wb") as out_swf:
              out_swf.write(valid_swf_data)
          print(f"Saved intact working_sfh2.swf ({len(valid_swf_data)} bytes)")
          EOF
          python3 recover_swf.py

          # Download JPEXS Free Flash Decompiler (FFDec CLI)
          FFDEC_URL=$(curl -s https://api.github.com/repos/jindrapetrik/jpexs-decompiler/releases/latest | grep -o 'https://[^"]*ffdec_[0-9.]*\.zip' | head -n 1)
          if [ -z "$FFDEC_URL" ]; then
            FFDEC_URL="https://github.com/jindrapetrik/jpexs-decompiler/releases/download/version21.1.1/ffdec_21.1.1.zip"
          fi
          curl -fL -s -o ffdec.zip "$FFDEC_URL"
          unzip -q ffdec.zip -d ffdec_cli

          mkdir -p decompiled_as3
          # Try batch selectclass first
          java -Djava.awt.headless=true -Xmx3072m -jar ffdec_cli/ffdec.jar \
            -selectclass Game,Player,Unit,Guns,Main,Menu,Aimer,ClassSave \
            -export script ./decompiled_as3 working_sfh2.swf > ffdec_stdout.log 2>&1 || true

          # If batch comma syntax exported 0 files, export each core class individually
          COUNT=$(find decompiled_as3 -name "*.as" | wc -l)
          if [ "$COUNT" -eq 0 ]; then
            for cls in Game Player Unit Guns Aimer Main Menu ClassSave; do
              java -Djava.awt.headless=true -Xmx3072m -jar ffdec_cli/ffdec.jar \
                -selectclass "$cls" \
                -export script ./decompiled_as3 working_sfh2.swf >> ffdec_stdout.log 2>&1 || true
            done
          fi

          cat << 'EOF' > patch_sfh2.py
          import os, glob, re, subprocess

          as_files = sorted(glob.glob("decompiled_as3/**/*.as", recursive=True))
          with open("sfh2_core_scripts.txt", "w", encoding="utf-8") as out:
              out.write(f"=== STRIKE FORCE HEROES 2 DECOMPILED CORE SCRIPTS ({len(as_files)} files) ===\n\n")
              if os.path.exists("swf_recovery.log"):
                  out.write("--- SWF RECOVERY LOG ---\n")
                  out.write(open("swf_recovery.log", "r", encoding="utf-8").read() + "\n")
              if len(as_files) == 0 and os.path.exists("ffdec_stdout.log"):
                  out.write("--- FFDEC LOG ---\n")
                  out.write(open("ffdec_stdout.log", "r", encoding="utf-8", errors="ignore").read() + "\n")
              for path in as_files:
                  out.write(f"\n{'='*60}\nFILE: {path}\n{'='*60}\n")
                  with open(path, "r", encoding="utf-8", errors="ignore") as src:
                      out.write(src.read())

          game_as_list = glob.glob("decompiled_as3/**/Game.as", recursive=True)
          if game_as_list:
              game_as_path = game_as_list[0]
              with open(game_as_path, "r", encoding="utf-8", errors="ignore") as f:
                  code = f.read()

              if "import flash.external.ExternalInterface;" not in code:
                  code = re.sub(
                      r"(package\s*\{)",
                      r"\1\nimport flash.external.ExternalInterface;\nimport flash.geom.Point;",
                      code,
                      count=1
                  )

              hook_snippet = """
              try {
                 if(ExternalInterface.available && this.player != null && !this.player.dead && this.unitCont != null) {
                    var _thorPlrPt:Point = this.unitCont.localToGlobal(new Point(this.player.x, this.player.y));
                    var _thorBestD:Number = 999999;
                    var _thorHX:Number = -1;
                    var _thorHY:Number = -1;
                    if(this.units != null) {
                       for each(var _thorU:* in this.units) {
                          if(_thorU != null && _thorU != this.player && !_thorU.dead && _thorU.team != this.player.team) {
                             var _thorEPt:Point = (_thorU.curHead != null) ? _thorU.curHead.localToGlobal(new Point(0,0)) : this.unitCont.localToGlobal(new Point(_thorU.x, _thorU.y - 34));
                             var _thorDist:Number = Math.abs(_thorEPt.x - _thorPlrPt.x) + Math.abs(_thorEPt.y - _thorPlrPt.y);
                             if(_thorDist < _thorBestD) {
                                _thorBestD = _thorDist;
                                _thorHX = _thorEPt.x;
                                _thorHY = _thorEPt.y;
                             }
                          }
                       }
                    }
                    ExternalInterface.call("thorSyncGame", _thorPlrPt.x, _thorPlrPt.y, this.player.flip, _thorHX, _thorHY, this.paused);
                 }
              } catch(_thorErr:*) {}
              """

              pattern = r"(public\s+function\s+EnterFrame\s*\([^)]*\)\s*(?::\s*\w+)?\s*\{)"
              if re.search(pattern, code):
                  patched_code = re.sub(pattern, r"\1\n" + hook_snippet, code, count=1)
                  with open(game_as_path, "w", encoding="utf-8") as f:
                      f.write(patched_code)
                  subprocess.run([
                      "java", "-Djava.awt.headless=true", "-Xmx3072m", "-jar", "ffdec_cli/ffdec.jar",
                      "-replace", "working_sfh2.swf", "patched_sfh2.swf",
                      "Game", game_as_path
                  ], check=False)
                  if os.path.exists("patched_sfh2.swf") and os.path.getsize("patched_sfh2.swf") > 5000000:
                      os.replace("patched_sfh2.swf", "working_sfh2.swf")
                      print("SUCCESS: Patched Game.as compiled into working_sfh2.swf")
          EOF
          python3 patch_sfh2.py

      - name: 6. Generate Android Native Project & Bundle Offline Ruffle
        run: |
          mkdir -p app/src/main/java/com/sfh2/thormax
          mkdir -p app/src/main/assets/ruffle
          mkdir -p app/src/main/res/values

          cp index.html app/src/main/assets/index.html
          cp working_sfh2.swf app/src/main/assets/sfh2.swf

          npm pack @ruffle-rs/ruffle
          tar -xzf ruffle-rs-ruffle-*.tgz
          cp -r package/* app/src/main/assets/ruffle/

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SFH2ThorMax"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.3.2' apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.sfh2.thormax'
              compileSdk 34

              defaultConfig {
                  applicationId "com.sfh2.thormax"
                  minSdk 26
                  targetSdk 34
                  versionCode 6
                  versionName "1.5-ThorMax-Recovered"
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.webkit:webkit:1.11.0'
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              android:installLocation="auto">

              <uses-feature android:name="android.hardware.gamepad" android:required="false" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />

              <application
                  android:label="Strike Force Heroes 2"
                  android:hardwareAccelerated="true"
                  android:isGame="true"
                  android:appCategory="game"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="sensorLandscape"
                      android:configChanges="orientation|screenSize|keyboard|keyboardHidden|navigation">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/sfh2/thormax/MainActivity.java
          package com.sfh2.thormax;

          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.os.Bundle;
          import android.os.SystemClock;
          import android.view.InputDevice;
          import android.view.KeyEvent;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.webkit.WebViewAssetLoader;
          import java.util.Locale;

          public class MainActivity extends Activity {
              private WebView webView;
              private boolean mouseWasDown = false;
              private long downTimestamp = 0;

              public class ThorInputBridge {
                  @JavascriptInterface
                  public void sendMouse(final float cssX, final float cssY, final boolean isDown) {
                      runOnUiThread(new Runnable() {
                          @Override
                          public void run() {
                              injectHardwareMouse(cssX, cssY, isDown);
                          }
                      });
                  }
              }

              private void injectHardwareMouse(float cssX, float cssY, boolean isDown) {
                  if (webView == null) return;
                  float density = getResources().getDisplayMetrics().density;
                  float px = cssX * density;
                  float py = cssY * density;
                  long now = SystemClock.uptimeMillis();

                  MotionEvent.PointerProperties[] props = new MotionEvent.PointerProperties[1];
                  props[0] = new MotionEvent.PointerProperties();
                  props[0].id = 0;
                  props[0].toolType = MotionEvent.TOOL_TYPE_MOUSE;

                  MotionEvent.PointerCoords[] coords = new MotionEvent.PointerCoords[1];
                  coords[0] = new MotionEvent.PointerCoords();
                  coords[0].x = px;
                  coords[0].y = py;
                  coords[0].pressure = isDown ? 1.0f : 0.0f;
                  coords[0].size = 1.0f;

                  MotionEvent hoverMove = MotionEvent.obtain(
                          now, now, MotionEvent.ACTION_HOVER_MOVE,
                          1, props, coords, 0, isDown ? MotionEvent.BUTTON_PRIMARY : 0,
                          1.0f, 1.0f, 0, 0, InputDevice.SOURCE_MOUSE, 0
                  );
                  webView.dispatchGenericMotionEvent(hoverMove);
                  hoverMove.recycle();

                  if (isDown && !mouseWasDown) {
                      mouseWasDown = true;
                      downTimestamp = now;
                      MotionEvent downEvt = MotionEvent.obtain(
                              downTimestamp, now, MotionEvent.ACTION_DOWN,
                              1, props, coords, 0, MotionEvent.BUTTON_PRIMARY,
                              1.0f, 1.0f, 0, 0, InputDevice.SOURCE_MOUSE, 0
                      );
                      webView.dispatchTouchEvent(downEvt);
                      downEvt.recycle();
                  } else if (isDown && mouseWasDown) {
                      MotionEvent dragEvt = MotionEvent.obtain(
                              downTimestamp, now, MotionEvent.ACTION_MOVE,
                              1, props, coords, 0, MotionEvent.BUTTON_PRIMARY,
                              1.0f, 1.0f, 0, 0, InputDevice.SOURCE_MOUSE, 0
                      );
                      webView.dispatchTouchEvent(dragEvt);
                      dragEvt.recycle();
                  } else if (!isDown && mouseWasDown) {
                      mouseWasDown = false;
                      MotionEvent upEvt = MotionEvent.obtain(
                              downTimestamp, now, MotionEvent.ACTION_UP,
                              1, props, coords, 0, 0,
                              1.0f, 1.0f, 0, 0, InputDevice.SOURCE_MOUSE, 0
                      );
                      webView.dispatchTouchEvent(upEvt);
                      upEvt.recycle();
                  }
              }

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  hideSystemBars();

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);

                  webView.addJavascriptInterface(new ThorInputBridge(), "ThorInputBridge");

                  final WebViewAssetLoader assetLoader = new WebViewAssetLoader.Builder()
                          .setDomain("appassets.androidplatform.net")
                          .addPathHandler("/assets/", new WebViewAssetLoader.AssetsPathHandler(this))
                          .build();

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                          return assetLoader.shouldInterceptRequest(request.getUrl());
                      }
                  });

                  webView.setWebChromeClient(new WebChromeClient());
                  webView.setFocusable(true);
                  webView.setFocusableInTouchMode(true);
                  webView.requestFocus();

                  webView.loadUrl("https://appassets.androidplatform.net/assets/index.html");
              }

              private void hideSystemBars() {
                  getWindow().getDecorView().setSystemUiVisibility(
                          View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                          | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                          | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                          | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                          | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                          | View.SYSTEM_UI_FLAG_FULLSCREEN
                  );
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) hideSystemBars();
              }

              @Override
              public boolean dispatchGenericMotionEvent(MotionEvent event) {
                  int src = event.getSource();
                  boolean isController = ((src & InputDevice.SOURCE_JOYSTICK) == InputDevice.SOURCE_JOYSTICK)
                          || ((src & InputDevice.SOURCE_GAMEPAD) == InputDevice.SOURCE_GAMEPAD);

                  if (isController && event.getAction() == MotionEvent.ACTION_MOVE) {
                      float lx = event.getAxisValue(MotionEvent.AXIS_X);
                      float ly = event.getAxisValue(MotionEvent.AXIS_Y);
                      float z  = event.getAxisValue(MotionEvent.AXIS_Z);
                      float rz = event.getAxisValue(MotionEvent.AXIS_RZ);
                      float rxAlt = event.getAxisValue(MotionEvent.AXIS_RX);
                      float ryAlt = event.getAxisValue(MotionEvent.AXIS_RY);
                      float lTrig = event.getAxisValue(MotionEvent.AXIS_LTRIGGER);
                      float rTrig = event.getAxisValue(MotionEvent.AXIS_RTRIGGER);
                      float brake = event.getAxisValue(MotionEvent.AXIS_BRAKE);
                      float gas   = event.getAxisValue(MotionEvent.AXIS_GAS);
                      float hatX  = event.getAxisValue(MotionEvent.AXIS_HAT_X);
                      float hatY  = event.getAxisValue(MotionEvent.AXIS_HAT_Y);

                      String js = String.format(Locale.US,
                              "if(window.onNativeGamepadAxes)window.onNativeGamepadAxes(%.4f,%.4f,%.4f,%.4f,%.4f,%.4f,%.4f,%.4f,%.4f,%.4f,%.4f,%.4f);",
                              lx, ly, z, rz, rxAlt, ryAlt, lTrig, rTrig, brake, gas, hatX, hatY);
                      webView.evaluateJavascript(js, null);
                      return true;
                  }
                  return super.dispatchGenericMotionEvent(event);
              }

              @Override
              public boolean dispatchKeyEvent(KeyEvent event) {
                  int code = event.getKeyCode();
                  boolean isGamepadKey = KeyEvent.isGamepadButton(code)
                          || code == KeyEvent.KEYCODE_DPAD_UP
                          || code == KeyEvent.KEYCODE_DPAD_DOWN
                          || code == KeyEvent.KEYCODE_DPAD_LEFT
                          || code == KeyEvent.KEYCODE_DPAD_RIGHT
                          || code == KeyEvent.KEYCODE_BACK;

                  if (isGamepadKey) {
                      if (event.getRepeatCount() == 0) {
                          boolean isDown = (event.getAction() == KeyEvent.ACTION_DOWN);
                          webView.evaluateJavascript(
                                  "if(window.onNativeKey)window.onNativeKey(" + code + "," + isDown + ");",
                                  null
                          );
                      }
                      return true;
                  }
                  return super.dispatchKeyEvent(event);
              }

              @Override
              public void onBackPressed() {
              }
          }
          EOF

      - name: 7. Compile Signed APK
        run: |
          gradle assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk StrikeForceHeroes2-ThorMax.apk

      - name: 8. Publish APK & Decompiled AS3 Code to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.5.${{ github.run_number }}
          name: "Strike Force Heroes 2 - Thor Max APK + Decompiled AS3 (Build #${{ github.run_number }})"
          files: |
            StrikeForceHeroes2-ThorMax.apk
            sfh2_core_scripts.txt
