name: Build SFH2 Thor Max APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository Files
        uses: actions/checkout@v4

      - name: 2. Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 4. Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 5. Generate Android Native Project & Download Offline Ruffle Engine
        run: |
          mkdir -p app/src/main/java/com/sfh2/thormax
          mkdir -p app/src/main/assets/ruffle
          mkdir -p app/src/main/res/values

          # Copy index.html into Android assets
          cp index.html app/src/main/assets/index.html

          # Automatically find any uploaded .swf file and copy as sfh2.swf
          SWF_FILE=$(find . -maxdepth 2 -iname "*.swf" | head -n 1)
          if [ -z "$SWF_FILE" ]; then
            echo "ERROR: No .swf file found in repository! Please upload sfh2.swf."
            exit 1
          fi
          cp "$SWF_FILE" app/src/main/assets/sfh2.swf

          # Download latest self-hosted Ruffle WebAssembly package for 100% offline play
          npm pack @ruffle-rs/ruffle
          tar -xzf ruffle-rs-ruffle-*.tgz
          cp -r package/* app/src/main/assets/ruffle/

          # Write settings.gradle
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SFH2ThorMax"
          include ':app'
          EOF

          # Write root build.gradle
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.3.2' apply false
          }
          EOF

          # Write gradle.properties
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          # Write app/build.gradle
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.sfh2.thormax'
              compileSdk 34

              defaultConfig {
                  applicationId "com.sfh2.thormax"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0-ThorMax"
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.webkit:webkit:1.11.0'
          }
          EOF

          # Write AndroidManifest.xml (Landscape Locked, Game Category, Hardware Accelerated)
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              android:installLocation="auto">

              <uses-feature android:name="android.hardware.gamepad" android:required="false" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />

              <application
                  android:label="Strike Force Heroes 2"
                  android:hardwareAccelerated="true"
                  android:isGame="true"
                  android:appCategory="game"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="sensorLandscape"
                      android:configChanges="orientation|screenSize|keyboard|keyboardHidden|navigation">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # Write MainActivity.java (WebViewAssetLoader + Xbox Controller Native Bridge)
          cat << 'EOF' > app/src/main/java/com/sfh2/thormax/MainActivity.java
          package com.sfh2.thormax;

          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.os.Bundle;
          import android.view.InputDevice;
          import android.view.KeyEvent;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.webkit.WebViewAssetLoader;
          import java.util.Locale;

          public class MainActivity extends Activity {
              private WebView webView;

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  hideSystemBars();

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);

                  final WebViewAssetLoader assetLoader = new WebViewAssetLoader.Builder()
                          .setDomain("appassets.androidplatform.net")
                          .addPathHandler("/assets/", new WebViewAssetLoader.AssetsPathHandler(this))
                          .build();

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                          return assetLoader.shouldInterceptRequest(request.getUrl());
                      }
                  });

                  webView.setWebChromeClient(new WebChromeClient());
                  webView.setFocusable(true);
                  webView.setFocusableInTouchMode(true);
                  webView.requestFocus();

                  webView.loadUrl("https://appassets.androidplatform.net/assets/index.html");
              }

              private void hideSystemBars() {
                  getWindow().getDecorView().setSystemUiVisibility(
                          View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                          | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                          | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                          | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                          | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                          | View.SYSTEM_UI_FLAG_FULLSCREEN
                  );
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) hideSystemBars();
              }

              @Override
              public boolean dispatchGenericMotionEvent(MotionEvent event) {
                  int src = event.getSource();
                  if ((src & InputDevice.SOURCE_JOYSTICK) == InputDevice.SOURCE_JOYSTICK
                          || (src & InputDevice.SOURCE_GAMEPAD) == InputDevice.SOURCE_GAMEPAD) {
                      float lx = event.getAxisValue(MotionEvent.AXIS_X);
                      float ly = event.getAxisValue(MotionEvent.AXIS_Y);
                      float rx = event.getAxisValue(MotionEvent.AXIS_Z);
                      float ry = event.getAxisValue(MotionEvent.AXIS_RZ);
                      float lt = Math.max(event.getAxisValue(MotionEvent.AXIS_LTRIGGER),
                                          event.getAxisValue(MotionEvent.AXIS_BRAKE));
                      float rt = Math.max(event.getAxisValue(MotionEvent.AXIS_RTRIGGER),
                                          event.getAxisValue(MotionEvent.AXIS_GAS));
                      float hatX = event.getAxisValue(MotionEvent.AXIS_HAT_X);
                      float hatY = event.getAxisValue(MotionEvent.AXIS_HAT_Y);

                      String js = String.format(Locale.US,
                              "if(window.onNativeAxes)window.onNativeAxes(%.4f,%.4f,%.4f,%.4f,%.4f,%.4f,%.4f,%.4f);",
                              lx, ly, rx, ry, lt, rt, hatX, hatY);
                      webView.evaluateJavascript(js, null);
                      return true;
                  }
                  return super.dispatchGenericMotionEvent(event);
              }

              @Override
              public boolean dispatchKeyEvent(KeyEvent event) {
                  int code = event.getKeyCode();
                  boolean isGamepadKey = KeyEvent.isGamepadButton(code)
                          || code == KeyEvent.KEYCODE_DPAD_UP
                          || code == KeyEvent.KEYCODE_DPAD_DOWN
                          || code == KeyEvent.KEYCODE_DPAD_LEFT
                          || code == KeyEvent.KEYCODE_DPAD_RIGHT
                          || code == KeyEvent.KEYCODE_BACK;

                  if (isGamepadKey) {
                      if (event.getRepeatCount() == 0) {
                          boolean isDown = (event.getAction() == KeyEvent.ACTION_DOWN);
                          webView.evaluateJavascript(
                                  "if(window.onNativeKey)window.onNativeKey(" + code + "," + isDown + ");",
                                  null
                          );
                      }
                      return true;
                  }
                  return super.dispatchKeyEvent(event);
              }

              @Override
              public void onBackPressed() {
                  // Prevent Android Back from accidentally closing the game mid-match
              }
          }
          EOF

      - name: 6. Compile Signed APK
        run: |
          gradle assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk StrikeForceHeroes2-ThorMax.apk

      - name: 7. Upload APK to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: StrikeForceHeroes2-ThorMax-APK
          path: StrikeForceHeroes2-ThorMax.apk

      - name: 8. Publish Direct Download Link to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Strike Force Heroes 2 - Thor Max APK (Build #${{ github.run_number }})"
          files: StrikeForceHeroes2-ThorMax.apk
